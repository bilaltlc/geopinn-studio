<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Arka plan -->
  <rect width="256" height="256" rx="40" fill="#0A0C0F"/>

  <!-- Prizma — üst yüzey -->
  <polygon points="128,32 210,88 46,88" fill="#E8A020"/>

  <!-- Orta katman -->
  <polygon points="46,88 210,88 198,144 58,144" fill="#E8A020" opacity="0.55"/>

  <!-- Alt katman -->
  <polygon points="58,144 198,144 186,200 70,200" fill="#E8A020" opacity="0.25"/>

  <!-- Sol kenar çizgisi -->
  <line x1="128" y1="32" x2="70" y2="200" stroke="#E8A020" stroke-width="1.5" opacity="0.35"/>

  <!-- Yatay derinlik çizgileri -->
  <line x1="50" y1="116" x2="206" y2="116" stroke="#E8A020" stroke-width="1" stroke-dasharray="6,5" opacity="0.5"/>
  <line x1="62" y1="172" x2="194" y2="172" stroke="#E8A020" stroke-width="1" stroke-dasharray="6,5" opacity="0.35"/>

  <!-- GP harfi üst yüzeyde -->
  <text x="128" y="80" text-anchor="middle"
    font-family="'Inter','Segoe UI',Arial,sans-serif"
    font-weight="900" font-size="38" fill="#0A0C0F" letter-spacing="2">GP</text>
</svg>
